<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>塗色樂園 - 學課互動樂園</title>
<link rel="stylesheet" href="css/style.css">
<style>
.paint-hero{ background:linear-gradient(135deg,#ffd166,#ff7eb3,#a1c4fd); padding:20px 18px 40px; border-radius:0 0 30px 30px; color:#fff; position:relative; overflow:hidden; }
.paint-hero h1{ font-size:26px; text-shadow:0 3px 10px rgba(0,0,0,.2); }
.paint-body{ max-width:640px; margin:-24px auto 60px; padding:0 14px; }
.scene-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.scene-tab{ padding:9px 14px; border-radius:999px; background:#fff; box-shadow:var(--shadow); font-size:14px; font-weight:800; color:var(--sub); }
.scene-tab.on{ background:linear-gradient(135deg,var(--pink),var(--purple)); color:#fff; }
.canvas-wrap{ background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:12px; }
#cvs{ width:100%; height:auto; display:block; background:#fff; border-radius:14px; border:3px dashed #eee0ff; touch-action:none; }
.palette{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; align-items:center; }
.swatch{ width:40px; height:40px; border-radius:50%; border:3px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,.15); transition:transform .15s; }
.swatch.on{ transform:scale(1.2); border-color:#4a3f6b; }
.size-btn{ padding:8px 12px; border-radius:12px; background:#fff; box-shadow:var(--shadow); font-size:13px; font-weight:800; color:var(--purple); }
.size-btn.on{ background:var(--purple); color:#fff; }
.tools{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
.stamp{ font-size:26px; padding:8px; border-radius:12px; background:#fff; box-shadow:var(--shadow); }
</style>
</head>
<body>
  <div class="paint-hero">
    <a class="back" href="index.html" style="display:inline-flex;align-items:center;gap:4px;color:#fff;font-weight:800;background:rgba(255,255,255,.25);padding:7px 14px;border-radius:999px;">← 返回樂園</a>
    <h1 style="margin-top:10px">🎨 塗色樂園</h1>
    <p style="margin-top:6px;opacity:.95">選一張圖，用手指塗上漂亮的顏色吧！</p>
  </div>

  <div class="paint-body">
    <div class="scene-tabs" id="scenes"></div>
    <div class="canvas-wrap">
      <canvas id="cvs" width="640" height="640"></canvas>
    </div>
    <div class="palette" id="palette"></div>
    <div class="tools">
      <button class="size-btn on" data-s="10">🖌️ 粗</button>
      <button class="size-btn" data-s="5">✏️ 中</button>
      <button class="size-btn" data-s="2">細</button>
      <button class="btn gray" id="eraser">🧽 橡皮擦</button>
      <button class="btn gray" id="clearBtn">🗑️ 清空</button>
      <button class="btn green" id="saveBtn">📸 存成圖片</button>
      <span class="stamp" data-e="⭐">⭐</span>
      <span class="stamp" data-e="💖">💖</span>
      <span class="stamp" data-e="🐟">🐟</span>
      <span class="stamp" data-e="🌈">🌈</span>
      <span class="stamp" data-e="🌟">🌟</span>
    </div>
    <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--sub)" id="hint"></div>
  </div>

  <div class="toast" id="toast"></div>
<script src="data/all_lessons.js"></script>
<script src="js/coloring.js"></script>
</body>
</html>
